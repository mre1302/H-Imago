name: Error o comportamiento inesperado
description: Informa de un fallo reproducible en H-IMAGO.
title: "[Error]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar. Antes de continuar, busca si el problema ya está reportado.

        No incluyas datos personales, documentos históricos privados ni credenciales. Si necesitas adjuntar un ejemplo, usa datos ficticios.
  - type: input
    id: version
    attributes:
      label: Versión de H-IMAGO
      description: Aparece en la aplicación o en el nombre del instalador.
      placeholder: "0.0.28"
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - Otro
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo de trabajo
      options:
        - SQLite (personal)
        - MySQL/MariaDB (equipo)
        - No estoy seguro
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Indica qué hiciste justo antes de que apareciera el problema.
      placeholder: |
        1. Abrir...
        2. Pulsar...
        3. Ver...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, mensajes o capturas
      description: Pega solo la parte relevante y elimina cualquier dato personal.
      render: shell
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: He eliminado datos personales, documentos privados y credenciales.
          required: true
