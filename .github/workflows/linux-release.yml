name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar comprobaciones
        run: npm run verificar

      - name: Leer versión
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Comprobar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "El tag $TAG_NAME no coincide con package.json ($VERSION)." >&2
            exit 1
          fi

      - name: Construir AppImage y .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run dist

      - name: Generar sumas SHA-256
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          appimage=(*.AppImage)
          deb=(*.deb)
          if [ ${#appimage[@]} -eq 0 ] || [ ${#deb[@]} -eq 0 ]; then
            echo "Faltan artefactos Linux: se esperaban un AppImage y un .deb." >&2
            exit 1
          fi
          sha256sum "${appimage[@]}" "${deb[@]}" > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: H-IMAGO-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
