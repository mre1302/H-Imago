name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Lint, sintaxis y pruebas SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test

  mysql:
    name: Integración MySQL/MariaDB
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: himago_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      HIMAGO_TEST_MYSQL: '1'
      HIMAGO_MYSQL_HOST: 127.0.0.1
      HIMAGO_MYSQL_PORT: '3306'
      HIMAGO_MYSQL_USER: root
      HIMAGO_MYSQL_PASSWORD: root
      HIMAGO_MYSQL_DATABASE: himago_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/mysql.test.js

  empaquetado:
    name: Empaquetado Linux (sin artefactos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:dir
