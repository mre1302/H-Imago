name: macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/macos-build

jobs:
  empaquetado:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            script: dist:mac:x64
          - arch: arm64
            script: dist:mac:arm64
    env:
      # Build sin firma. Para firmar y notarizar, elimina esta variable y
      # configura CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID como secretos.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: H-IMAGO-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
